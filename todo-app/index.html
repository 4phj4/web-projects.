<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清新代办清单</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-category="tentative">
  <main class="app-shell">
    <section class="todo-card">
      <div class="hero">
        <p class="eyebrow">Green Todo</p>
        <h1>清新代办事件</h1>
        <p class="subtitle">按分类切换任务，带计划时间的事项会优先按紧急程度排序。</p>
      </div>

      <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
          <section class="dashboard-panel stats-panel" aria-label="任务统计">
            <div class="panel-heading">
              <p class="panel-kicker">概览</p>
              <h2>任务统计</h2>
            </div>

            <div class="stats-stack">
              <article class="stat-chip">
                <span class="stat-label">总任务数</span>
                <strong id="total-count">0</strong>
              </article>
              <article class="stat-chip">
                <span class="stat-label">已完成</span>
                <strong id="completed-count">0</strong>
              </article>
              <article class="stat-chip">
                <span class="stat-label">未完成</span>
                <strong id="pending-count">0</strong>
              </article>
            </div>
          </section>

          <nav class="dashboard-panel category-panel" aria-label="任务分类导航">
            <div class="panel-heading">
              <p class="panel-kicker">切换</p>
              <h2>任务分类</h2>
            </div>

            <div class="category-nav">
              <button class="category-tab" type="button" data-category-tab data-category="urgent">紧急</button>
              <button class="category-tab" type="button" data-category-tab data-category="soon">稍紧急</button>
              <button class="category-tab" type="button" data-category-tab data-category="relaxed">不紧急</button>
              <button class="category-tab is-active" type="button" data-category-tab data-category="tentative">暂定</button>
            </div>
          </nav>
        </aside>

        <section class="dashboard-main">
          <section class="dashboard-panel composer-panel">
            <div class="panel-heading">
              <p class="panel-kicker">录入</p>
              <h2>添加新事件</h2>
            </div>

            <form class="todo-form" id="todo-form">
              <label class="sr-only" for="todo-input">输入代办事件</label>
              <input
                id="todo-input"
                class="todo-input"
                type="text"
                name="todo"
                placeholder="输入你的事件..."
                maxlength="120"
                autocomplete="off"
              >

              <label class="sr-only" for="category-select">选择任务分类</label>
              <select id="category-select" class="category-select" name="category">
                <option value="urgent">紧急</option>
                <option value="soon">稍紧急</option>
                <option value="relaxed">不紧急</option>
                <option value="tentative" selected>暂定</option>
              </select>

              <button class="add-button" type="submit" aria-label="添加任务">+</button>
            </form>
          </section>

          <section class="dashboard-panel list-panel">
            <div class="panel-heading list-heading">
              <div>
                <p class="panel-kicker">当前视图</p>
                <h2 id="current-category-title">暂定任务</h2>
              </div>
            </div>

            <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
            <p class="empty-state" id="empty-state">当前分类还没有事件，先添加一条开始吧。</p>
          </section>
        </section>
      </div>
    </section>
  </main>

  <div class="planner-modal hidden" id="planner-modal" role="dialog" aria-modal="true" aria-labelledby="planner-title">
    <div class="planner-panel">
      <div class="planner-header">
        <h2 id="planner-title">设置计划时间</h2>
        <button class="planner-close" id="planner-close" type="button" aria-label="关闭弹窗">×</button>
      </div>
      <p class="planner-copy" id="planner-task-text"></p>
      <form class="planner-form" id="planner-form">
        <label class="planner-label" for="planner-input">计划时间</label>
        <input id="planner-input" class="planner-input" type="datetime-local">
        <div class="planner-actions">
          <button class="planner-button planner-button-soft" id="planner-clear" type="button">清除</button>
          <button class="planner-button planner-button-ghost" id="planner-cancel" type="button">取消</button>
          <button class="planner-button planner-button-primary" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
